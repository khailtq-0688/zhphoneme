# ViWordFormer Vietnamese Fine-tuning Configuration
# Load pretrained multilingual model and fine-tune on Vietnamese data

tokenizer:
  type: unigram
  vocab_size: 30000
  model_path: ./tokenizers/unigram_tokenizer.model

model:
  type: viwordformer
  d_model: 768
  nlayers: 12
  head: 12
  d_ff: 3072
  dropout: 0.1
  attention_dropout: 0.1
  vocab_size: 30000

dataset:
  max_seq_len: 512
  mlm_probability: 0.15  # Percentage of tokens to mask
  include_cls_sep: true

data_paths:
  vietnamese:
    path: "/path/to/vietnamese/curated/dataset"
  chinese:
    path: ""  # Not used for Vietnamese fine-tuning

training:
  optimizer: adamw
  learning_rate: 6e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  eps: 1e-6
  batch_size: 512
  num_epochs: 5
  warmup_steps: 24000
  scheduler: lambda
  gradient_accumulation_steps: 2
  gradient_clip_norm: 1.0
  save_steps: 1000
  eval_steps: 2000

preprocessing:
  output_dir: ./processed_data/vietnamese_finetune
  merge_output: vietnamese_processed.txt

checkpoint:
  checkpoint_dir: ./checkpoints/vietnamese_finetune
  save_best: true
  save_last: true
  keep_last_n: 3

device: cuda  # 'cuda' for GPU, 'cpu' for CPU
seed: 42
mixed_precision: false  # Set to true for FP16 training if GPU supports it
