# ViWordFormer Pretraining Configuration - Vietnamese Subset Format
# For Vietnamese Curated corpus with subset_*.txt file structure

model:
  type: ViWordFormer
  d_model: 768
  nlayers: 12
  head: 12
  d_q: 64
  d_kv: 64
  d_ff: 3072
  dropout: 0.1
  pad_idx: 3
  max_seq_len: 512
  label_smoothing: 0.1

dataset:
  type: SubsetDataset
  corpus_dir: ../../vietnamese_curated
  max_seq_len: 512
  mlm_probability: 0.15
  lines_per_file: 1000

tokenizer:
  type: bpe
  model_prefix: ./tokenizers/unigram_tokenizer_vietnamese_subset
  vocab_size: 30000
  character_coverage: 0.9999

training:
  task: MLMPretraining
  
  # Optimization
  optimizer: adamw
  scheduler: lambda
  learning_rate: 0.00005
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 0.000001
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1
  
  # Training parameters
  batch_size: 32
  num_epochs: 100
  num_workers: 4
  device: cuda
  patience: 5
  
  # Checkpoint settings
  save_steps: 1000
  eval_steps: 2000

preprocessing:
  output_dir: ./processed_data/vietnamese_subset_pretrain
  normalize: true
