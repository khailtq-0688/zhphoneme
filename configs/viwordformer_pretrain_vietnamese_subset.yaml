# ViWordFormer Pretraining Configuration - Vietnamese Subset Format
# For Vietnamese Curated corpus with subset_*.txt file structure

model:
  type: ViWordFormer
  hidden_size: 768
  num_hidden_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  hidden_act: gelu
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  max_position_embeddings: 512
  type_vocab_size: 2
  initializer_range: 0.02
  layer_norm_eps: 1.0e-12

dataset:
  type: SubsetDataset
  corpus_dir: ../../vietnamese_curated
  max_seq_len: 512
  mlm_probability: 0.15
  lines_per_file: 1000

tokenizer:
  type: unigram
  model_prefix: ./tokenizers/unigram_tokenizer_vietnamese_subset
  vocab_size: 30000
  character_coverage: 0.9999

training:
  task: MLMPretraining
  
  # Optimization
  optimizer: adamw
  scheduler: lambda
  learning_rate: 6.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  eps: 1.0e-6
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1
  
  # Training parameters
  batch_size: 512
  num_epochs: 5
  num_workers: 4
  
  # Warmup will be calculated as 5% of total_steps dynamically
  # warmup_steps formula: int(total_steps * 0.05)
  
  # Checkpoint settings
  save_steps: 1000
  eval_steps: 2000

preprocessing:
  output_dir: ./processed_data/vietnamese_subset_pretrain
  normalize: true
