# ViWordFormer Pretraining Configuration - Chinese Subset Format
# For Baidu Baike corpus with subset_*.txt file structure

model:
  type: ViWordFormer
  hidden_size: 768
  num_hidden_layers: 12
  num_attention_heads: 12
  d_q: 64
  d_kv: 64
  intermediate_size: 3072
  hidden_act: gelu
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  max_position_embeddings: 512
  type_vocab_size: 2
  initializer_range: 0.02
  layer_norm_eps: 1.0e-12
  max_seq_len: 512
  label_smoothing: 0.1

dataset:
  type: SubsetDataset
  corpus_dir: ../../baidubaike_chinese
  max_seq_len: 512
  mlm_probability: 0.3
  lines_per_file: 1000

tokenizer:
  type: unigram
  model_prefix: checkpoints/unigram_tokenizer_chinese_subset
  vocab_size: 30000
  character_coverage: 0.9999

training:
  task: MLMPretraining
  
  # Optimization
  optimizer: adamw
  scheduler: lambda
  learning_rate: 6.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  eps: 1.0e-6
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1
  
  # Training parameters
  batch_size: 256
  num_epochs: 150
  num_workers: 4
  device: cuda
  patience: 5
  
  # Warmup will be calculated as 5% of total_steps dynamically
  # warmup_steps formula: int(total_steps * 0.05)
  
  # Checkpoint settings
  save_steps: 1000
  eval_steps: 2000

preprocessing:
  output_dir: ./processed_data/chinese_subset_pretrain
  normalize: true
