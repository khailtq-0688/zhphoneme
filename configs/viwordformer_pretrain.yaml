# ViWordFormer Multilingual Pretraining Configuration
# Supports Vietnamese (Curated) and Chinese (CommonCrawl)

tokenizer:
  type: unigram
  model_type: unigram
  vocab_size: 30000
  character_coverage: 0.9995
  model_prefix: "./outputs/unigram_tokenizer"
  normalization_rule: identity
  unk_piece: <unk>
  bos_piece: <s>
  eos_piece: </s>
  pad_piece: <pad>

model:
  name: viwordformer_pretrain
  architecture: ViWordFormer
  
  # Architecture parameters
  d_model: 768
  d_ff: 3072
  nlayers: 12
  head: 12
  d_q: 64
  d_kv: 64
  
  # Regularization
  dropout: 0.1
  label_smoothing: 0.1
  max_seq_len: 512
  pad_idx: 3
  
  # Device
  device: cuda

dataset:
  type: PretrainingDataset
  file_path: "./processed_data/merged_corpus.txt"
  max_seq_len: 512
  mlm_probability: 0.15

training:
  task: MLMPretraining
  
  # Optimization
  optimizer: adamw
  scheduler: lambda
  learning_rate: 6e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  eps: 1e-6
  gradient_clip_val: 1.0
  gradient_accumulation_steps: 1
  
  # Training parameters
  batch_size: 512
  num_epochs: 5
  num_workers: 4
  
  # Warmup with linear decay
  warmup_steps: 24000
  
  # Checkpointing
  checkpoint_dir: "./checkpoints"
  save_steps: 500
  log_steps: 100
  save_total_limit: 3
  
  # Device
  device: cuda
  fp16: false

# Data paths - UPDATE THESE WITH YOUR ACTUAL PATHS
data_paths:
  vietnamese:
    type: curated
    path: "/path/to/vietnamese/curated/dataset"
    description: "Vietnamese Curated Dataset"
  
  chinese:
    type: commoncrawl
    path: "/path/to/chinese/commoncrawl/dataset"
    description: "Chinese CommonCrawl Dataset"

# Processing
preprocessing:
  output_dir: "./processed_data"
  merge_output: "merged_corpus.txt"
  workers: 8
